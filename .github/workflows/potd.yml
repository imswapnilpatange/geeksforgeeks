name: GFG POTD Sync

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      runtime:
        required: false
      memory:
        required: false
      language:
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - run: pip install requests beautifulsoup4

      - name: Run Script
        env:
          GFG_SESSION: ${{ secrets.GFG_SESSION }}
        run: python potd_sync.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          MSG=$(cat commit_msg.txt)
          git commit -m "$MSG"
          git push
