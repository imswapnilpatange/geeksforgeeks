name: GFG POTD Sync

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      runtime:
        description: "Python version"
        required: false
        default: "3.10"
        type: string
      memory:
        description: "Memory limit (MB)"
        required: false
        default: "512"
        type: string
      language:
        description: "Programming language"
        required: false
        default: "java"
        type: string
      startDate:
        description: "Start date (YYYY-MM-DD)"
        required: false
        type: string
      endDate:
        description: "End date (YYYY-MM-DD)"
        required: false
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ github.event.inputs.runtime || '3.10' }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Script
        env:
          GFG_SESSION: ${{ secrets.GFG_SESSION }}
          LANGUAGE: ${{ github.event.inputs.language || 'java' }}
          MEMORY: ${{ github.event.inputs.memory || '512' }}
          START_DATE: ${{ github.event.inputs.startDate || '' }}
          END_DATE: ${{ github.event.inputs.endDate || '' }}
        run: python potd_sync.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          MSG=$(cat commit_msg.txt)
          git commit -m "$MSG"
          git push
