name: GfG POTD Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"  # 12 AM IST

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install playwright beautifulsoup4
          playwright install chromium

      - name: Run script
        env:
          GFG_COOKIE: ${{ secrets.GFG_COOKIE }}
        run: python potd_sync.py

      - name: Commit
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Added Solution - GfG Sync" || echo "No changes"
          git push
